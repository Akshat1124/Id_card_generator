<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>HH Goa 2026 — Frame Generator</title>
  <meta name="description"
    content="Generate your branded HH Goa 2026 graphic. Upload your photo, download your frame, share on X. #FrameInGoa">

  <!-- OG / Twitter Card -->
  <meta property="og:title" content="HH Goa 2026 — Frame Generator">
  <meta property="og:description" content="Get your HH Goa 2026 builder frame. Upload, generate, share. #FrameInGoa">
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="assets/og-image.png">

  <!-- Fonts — same as hhgoa.com: Imbue (display) + Victor Mono (body/labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Imbue:opsz,wght@10..100,400;10..100,700;10..100,800;10..100,900&family=Victor+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <!-- Sunrise illustration as real img — shows natural colors, no green overlay -->
    <img src="assets/brand/sunrise_illustration.png" alt="" aria-hidden="true" class="header__sunrise">
    <div class="header__logo-wrap">
      <img src="assets/brand/hacker_house_wordmark_sm.svg" alt="Hacker House Goa 2026" class="header__wordmark">
    </div>
    <p class="header__location">GOA, INDIA &middot; AUGUST 2026</p>
    <p class="header__tagline">Get your builder frame &amp; share on X. #FrameInGoa</p>
  </header>

  <div class="cross-divider" aria-hidden="true">
    <img src="assets/brand/decorative_border.svg" alt="" class="divider__img">
  </div>

  <!-- MAIN APP -->
  <main class="app" id="app">

    <!-- STEP 1: Upload -->
    <section class="step step--active" id="step-upload" aria-label="Step 1: Upload photo">
      <h1 class="step__title">Drop your photo</h1>
      <div class="upload-zone" id="upload-zone" role="button" tabindex="0" aria-label="Upload photo">
        <div class="upload-zone__icon">↑</div>
        <p class="upload-zone__text">Tap to upload or drag your photo here</p>
        <p class="upload-zone__hint">JPG, PNG, HEIC · Max 20 MB</p>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif" hidden>
      </div>
      <p class="upload-zone__error" id="upload-error" role="alert" hidden></p>
    </section>

    <!-- STEP 2: Format + Fields -->
    <section class="step" id="step-config" aria-label="Step 2: Customise your graphic" hidden>
      
      <div class="step-config-layout">
        <!-- LEFT COLUMN: Settings -->
        <div class="step-config__settings">
          <!-- Format toggle — Builder ID Card (B) active by default -->
          <div class="format-toggle" id="format-toggle" role="group" aria-label="Choose format">
            <button class="format-toggle__btn format-toggle__btn--active" id="btn-format-b" data-format="b">
              <span class="format-toggle__label">Builder ID Card</span>
              <span class="format-toggle__desc">Event badge with your details</span>
            </button>
            <button class="format-toggle__btn" id="btn-format-a" data-format="a">
              <span class="format-toggle__label">PFP Frame</span>
              <span class="format-toggle__desc">Wraps your photo for X profile</span>
            </button>
          </div>

          <!-- Photo Controls -->
          <div class="photo-controls">
            <div class="photo-controls__header">
              <span class="field__label">Adjust Photo</span>
              <button type="button" class="btn btn--ghost btn--sm" id="btn-reset-photo" title="Reset photo adjustments">↺ Reset</button>
            </div>

            <div class="control-group">
              <label class="control-label" for="slider-zoom">
                <span>Zoom</span>
                <span id="val-zoom" class="val-badge">100%</span>
              </label>
              <input type="range" id="slider-zoom" class="range-slider" min="50" max="200" value="100" step="2">
            </div>

            <div class="control-group">
              <label class="control-label" for="slider-offset-x">
                <span>Position X</span>
                <span id="val-offset-x" class="val-badge">0px</span>
              </label>
              <input type="range" id="slider-offset-x" class="range-slider" min="-150" max="150" value="0" step="2">
            </div>

            <div class="control-group">
              <label class="control-label" for="slider-offset-y">
                <span>Position Y</span>
                <span id="val-offset-y" class="val-badge">0px</span>
              </label>
              <input type="range" id="slider-offset-y" class="range-slider" min="-150" max="150" value="0" step="2">
            </div>

            <button type="button" class="btn btn--ghost btn--sm" id="btn-change-photo" style="margin-top: 6px; width: 100%;">📷 Change Photo</button>
          </div>

          <!-- Format B fields -->
          <div class="fields" id="fields-b">
            <label class="field" for="input-name">
              <span class="field__label">Your Name</span>
              <input class="field__input" id="input-name" type="text" placeholder="Akshat Srivastava" maxlength="40" autocomplete="name">
            </label>
            <label class="field" for="input-stack">
              <span class="field__label">Stack / Role</span>
              <input class="field__input" id="input-stack" type="text" placeholder="Full-Stack · Builder · Founder" maxlength="60">
            </label>
            <div class="field field--team">
              <label class="field__label" for="input-team">Team Name</label>
              <input class="field__input team__input" id="input-team" type="text" placeholder="Your Team Name" maxlength="40">
            </div>
          </div>
          
          <button class="btn btn--primary btn--lg" id="btn-generate">Generate My Graphic ✨</button>
        </div>

        <!-- RIGHT COLUMN: Live Preview -->
        <div class="step-config__preview">
          <div class="live-preview-box">
            <img id="photo-preview" alt="Your uploaded photo" class="photo-preview__img" style="width:100%; height:auto; aspect-ratio:4/5; object-fit:cover;">
            <span class="live-preview-badge">Live Preview</span>
          </div>
        </div>
      </div>
    </section>

    <!-- STEP 3: Output -->
    <section class="step" id="step-output" aria-label="Step 3: Your graphic" hidden>
      <h2 class="step__title">Here's your graphic! 🚀</h2>
      <div class="output-preview" id="output-preview-container">
        <img id="output-preview" alt="Your HH Goa 2026 graphic" class="output-preview__img">
      </div>
      <div class="output-actions">
        <button class="btn btn--primary btn--lg" id="btn-download">⬇ Download PNG</button>
        <button class="btn btn--x btn--lg" id="btn-share-x">𝕏 Share on X</button>
      </div>
      <button class="btn btn--ghost btn--sm" id="btn-start-over">Start over</button>
    </section>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay" hidden aria-live="polite">
      <div class="loading-overlay__spinner"></div>
      <p class="loading-overlay__text">Generating your graphic…</p>
    </div>

  </main>

  <div class="cross-divider" aria-hidden="true">
    <img src="assets/brand/decorative_border.svg" alt="" class="divider__img">
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <img src="assets/brand/footer_trees.png" alt="" aria-hidden="true" class="footer__trees">
  </footer>

  <!-- heic2any CDN -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <!-- ADR-010: detect CDN load failure before any upload attempt -->
  <script>window.__heic2anyLoaded = typeof heic2any !== 'undefined'</script>

  <!-- App entry point -->
  <script type="module" src="scripts/main.js"></script>
</body>

</html>
